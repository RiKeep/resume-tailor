<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='12' fill='%23323E4F'/%3E%3Ccircle cx='11' cy='13' r='4' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M14 10l5-5' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============== 基础 ============== */
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --main:#323E4F;     /* 主深蓝灰 */
  --t-dark:#262626;   /* 正文深灰 */
  --t-black:#000000;  /* 教育正文黑 */
}
html, body {
  background:#e9e9e9;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body { padding:24px 0; display:flex; justify-content:center; }
.page {
  width:210mm;
  min-height:297mm;
  background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,.18);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* 顶部深色横条 */
.top-bar { height:5.5mm; background:var(--main); }

.content { padding: 7mm 13mm 10mm; }

/* ============== 头部 ============== */
.header { display:flex; align-items:flex-start; justify-content:space-between; gap:5mm; }
.name-block { flex:0 0 auto; padding-top:1mm; }
.name-block h1 { font-size:20pt; font-weight:700; color:var(--main); letter-spacing:4px; }
.name-block .apply { font-size:9pt; font-weight:700; color:var(--main); margin-top:4mm; }

.contact { flex:1; display:flex; flex-direction:column; gap:3mm; padding-top:1.5mm; align-items:flex-start; margin-left:6mm; }
.c-line { display:flex; align-items:center; font-size:11pt; color:var(--t-dark); line-height:1.4; white-space:nowrap; }
.c-line .ic { width:6mm; flex:0 0 6mm; display:flex; align-items:center; justify-content:center; }
.c-line .ic svg { width:4.6mm; height:4.6mm; display:block; }

.photo { flex:0 0 auto; width:28mm; height:35mm; object-fit:cover; }

/* ============== 小节标题 ============== */
.section { margin-top:7mm; }
.sec-title { display:flex; align-items:center; gap:3.5mm; }
.icon-circle {
  width:9mm; height:9mm; flex:0 0 9mm;
  border-radius:50%;
  background:var(--main);
  display:flex; align-items:center; justify-content:center;
}
.icon-circle svg { width:6.2mm; height:6.2mm; }
.sec-title h2 { font-size:14pt; font-weight:700; color:var(--main); white-space:nowrap; }
.sec-title .line { flex:1; height:1.5px; background:var(--main); }

/* ============== 经历抬头 ============== */
.entry-head { display:flex; align-items:baseline; font-size:10.5pt; color:var(--main); font-weight:700; margin:4mm 0 2mm; }
.entry-head .date { flex:0 0 auto; }
.entry-head .org { flex:1; text-align:center; }
.entry-head .role { flex:0 0 auto; }

/* ============== 菱形列表 ============== */
.diamond-list { list-style:none; font-size:10.5pt; line-height:1.75; }
.diamond-list li { position:relative; padding-left:6.5mm; }
.diamond-list li::before {
  content:""; position:absolute; left:0.8mm; top:2.4mm;
  width:2.4mm; height:2.4mm; background:var(--main); transform:rotate(45deg);
}
.diamond-list li + li { margin-top:1mm; }
.c-black { color:var(--t-black); }
.c-dark { color:var(--t-dark); }

/* 技能证书行 */
.skill-line { font-size:10.5pt; line-height:2; }
.skill-line .k { font-weight:700; color:var(--t-dark); }
.skill-line .v { color:var(--t-dark); }

/* ============== 打印 ============== */
@page { size:A4; margin:0; }
@media print {
  body { background:#fff; padding:0; }
  .page { box-shadow:none; width:210mm; min-height:297mm; }
}
</style>
</head>
