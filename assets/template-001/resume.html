<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23414141'/%3E%3Cpath d='M7 4h10v3H7zM5 8h14v12H5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============== 基础与页面（A4 精确尺寸） ============== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --gray-bar:#D8D8D8;      /* 浅灰横条 */
  --dark-block:#414141;    /* 深色标题块 */
  --text:#404040;          /* 正文颜色 */
  --bullet:#BFBFBF;        /* 项目圆点 */
}

html, body {
  background: #e9e9e9;
  font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

body { padding: 24px 0; display: flex; justify-content: center; }

.page {
  width: 210mm;
  min-height: 297mm;
  background: #fff;
  padding: 10mm 12.7mm;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ============== 顶部大标题灰条 ============== */
.banner {
  height: 18mm;
  background: var(--gray-bar);
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner h1 {
  font-size: 30pt;
  font-weight: 400;
  color: var(--dark-block);
  letter-spacing: 6px;
}

/* ============== 基本信息 ============== */
.profile {
  position: relative;
  padding: 7mm 0 5mm;
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 8mm;
  row-gap: 2.6mm;
}
.photo {
  position: absolute;
  right: 0;
  top: 6mm;
  width: 27mm;
  height: 34mm;
  object-fit: cover;
}
.info-item {
  font-size: 10pt;
  line-height: 1.5;
  white-space: nowrap;
}
.info-item .label {
  font-weight: 700;
  display: inline-block;
}
.info-item .value { font-weight: 400; }

/* ============== 小节标题（深色块 + 灰条） ============== */
.section-title {
  display: flex;
  align-items: stretch;
  height: 8.2mm;
  margin-bottom: 3mm;
}
.section-title .dark {
  background: var(--dark-block);
  color: #fff;
  font-size: 14pt;
  font-weight: 400;
  padding: 0 4.5mm;
  display: flex;
  align-items: center;
}
.section-title .light {
  flex: 1;
  background: var(--gray-bar);
}

section + section { margin-top: 4.5mm; }

/* ============== 经历抬头（时间 / 单位 / 职位） ============== */
.entry-head {
  display: flex;
  align-items: baseline;
  font-size: 10pt;
  margin-bottom: 1.8mm;
}
.entry-head .date { flex: 0 0 auto; }
.entry-head .org {
  flex: 1;
  text-align: center;
}
.entry-head .role { flex: 0 0 auto; }

/* ============== 正文与圆点列表 ============== */
.desc {
  font-size: 10pt;
  line-height: 1.7;
}
.bullet-list {
  list-style: none;
  font-size: 10pt;
  line-height: 1.7;
}
.bullet-list li {
  position: relative;
  padding-left: 6mm;
}
.bullet-list li::before {
  content: "";
  position: absolute;
  left: 1.2mm;
  top: 2.6mm;
  width: 2.2mm;
  height: 2.2mm;
  border-radius: 50%;
  background: var(--bullet);
}
.entry + .entry { margin-top: 3mm; }
.plain-text { font-size: 10pt; line-height: 1.8; }

/* ============== 打印 / PDF 导出 ============== */
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; padding: 0; }
  .page {
    box-shadow: none;
    width: 210mm;
    min-height: 297mm;
  }
}
</style>
</head>
<body>
<div class="page">

  <!-- ===== 顶部标题 ===== -->
  <header class="banner">
    <h1></h1>
  </header>

  <!-- ===== 基本信息 ===== -->
  <div class="profile">
    <img class="photo" src="assets/photo.jpeg" alt="证件照">
    <div class="info-item"><span class="label">姓　　名</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">出生年月</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">民　　族</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">身　　高</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">电　　话</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">政治面貌</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">邮　　箱</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">毕业院校</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">住　　址</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">学　　历</span>　<span class="value"></span></div>
    <div class="info-item"><span class="label">求职意向</span>　<span class="value"></span></div>
  </div>

  <!-- ===== 教育背景 ===== -->
  <section>
    <div class="section-title"><span class="dark">教育背景</span><span class="light"></span></div>
    <div class="entry">
      <div class="entry-head">
        <span class="date"></span>
        <span class="org"></span>
        <span class="role"></span>
      </div>
      <p class="desc"></p>
    </div>
  </section>

  <!-- ===== 实习经历 ===== -->
  <section>
    <div class="section-title"><span class="dark">实习经历</span><span class="light"></span></div>

    <div class="entry">
      <div class="entry-head">
        <span class="date"></span>
        <span class="org"></span>
        <span class="role"></span>
      </div>
      <ul class="bullet-list">
        <li></li>
        <li></li>
      </ul>
    </div>

    <div class="entry">
      <div class="entry-head">
        <span class="date"></span>
        <span class="org"></span>
        <span class="role"></span>
      </div>
      <ul class="bullet-list">
        <li></li>
        <li></li>
      </ul>
    </div>
  </section>

  <!-- ===== 校内实践 ===== -->
  <section>
    <div class="section-title"><span class="dark">校内实践</span><span class="light"></span></div>
    <div class="entry">
      <div class="entry-head">
        <span class="date"></span>
        <span class="org"></span>
        <span class="role"></span>
      </div>
      <ul class="bullet-list">
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>
  </section>

  <!-- ===== 技能证书 ===== -->
  <section>
    <div class="section-title"><span class="dark">技能证书</span><span class="light"></span></div>
    <p class="plain-text"></p>
    <p class="plain-text"></p>
    <p class="plain-text"></p>
  </section>

  <!-- ===== 自我评价 ===== -->
  <section>
    <div class="section-title"><span class="dark">自我评价</span><span class="light"></span></div>
    <p class="plain-text"></p>
  </section>

</div>
</body>
</html>
