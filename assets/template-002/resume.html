<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%235485A5'/%3E%3Cpath d='M4 12l5-5h11v10H9z' fill='%23335264'/%3E%3C/svg%3E">
<style>
/* ============== 基础 ============== */
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --blue:#5485A5;        /* 主蓝 */
  --blue-dark:#335264;   /* 深蓝箭头 */
  --t1:#3F3F3F;          /* 基本信息文字 */
  --t2:#595959;          /* 其他文字 */
  --icon:#4D4D4D;        /* 图标色 */
  --line:#D9D9D9;        /* 分隔线 */
}
html, body {
  background:#e9e9e9;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body { padding:24px 0; display:flex; justify-content:center; }
.page {
  width:210mm;
  min-height:297mm;
  background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,.18);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
.content { padding: 0 31.8mm 25.4mm; }

/* ============== 顶部横幅 ============== */
.banner {
  height:25mm;
  background:var(--blue);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.5mm;
}
.banner h1 { color:#fff; font-size:24pt; font-weight:400; letter-spacing:3px; }
.banner .slogan { color:#fff; font-size:10pt; font-weight:400; }

/* ============== 小节箭头标签 + 横线 ============== */
.section { margin-top:7mm; }
.section-tag { display:flex; align-items:center; height:9mm; }
.section-tag .tri {
  width:4.6mm;
  height:5.9mm;
  background:var(--blue-dark);
  clip-path:polygon(0 50%, 100% 0, 100% 100%);
  margin-right:-0.8mm;
}
.section-tag .body {
  height:100%;
  background:var(--blue);
  color:#fff;
  font-size:12pt;
  font-weight:400;
  padding:0 7mm;
  display:flex;
  align-items:center;
}
.section-line { height:1px; background:var(--line); margin-top:2mm; }

/* ============== 基本信息 ============== */
.basic { position:relative; padding-top:6mm; display:grid; grid-template-columns:1fr 1fr; column-gap:6mm; row-gap:2.8mm; }
.basic .photo {
  position:absolute; right:0; top:0;
  width:29mm; height:36mm; object-fit:cover;
}
.b-line { display:flex; align-items:center; font-size:10.5pt; color:var(--t1); line-height:1.5; white-space:nowrap; }
.b-line .ic { width:5mm; flex:0 0 5mm; display:flex; align-items:center; justify-content:center; }
.b-line .ic svg { width:4mm; height:4mm; display:block; }
.b-line .k { font-weight:400; }

/* ============== 通用两列经历 ============== */
.two-col { display:grid; grid-template-columns:38mm 1fr; column-gap:6mm; padding-top:5mm; }
.two-col + .two-col { margin-top:5mm; }
.col-left .title { font-size:10.5pt; font-weight:700; color:var(--t2); display:flex; align-items:center; }
.col-left .title::before {
  content:""; width:2.4mm; height:2.4mm; background:var(--t2); margin-right:2.5mm; flex:0 0 auto;
}
.col-left .date { font-size:10.5pt; color:var(--t2); margin-top:1.5mm; padding-left:5mm; }
.col-right { font-size:10.5pt; color:var(--t2); line-height:1.75; }
.col-right .org { font-weight:700; }
.col-right p { margin-top:1mm; }

/* ============== 段落 ============== */
.paragraph { padding-top:5mm; font-size:10.5pt; color:var(--t2); line-height:1.8; }

/* ============== 专业技能圆点 ============== */
.skill-list { list-style:none; padding-top:5mm; }
.skill-list li {
  position:relative; padding-left:7mm; font-size:10.5pt; color:var(--t2); line-height:1.9;
}
.skill-list li::before {
  content:""; position:absolute; left:1mm; top:2.4mm;
  width:2.4mm; height:2.4mm; border-radius:50%; background:var(--t2);
}
.skill-list .k { font-weight:700; margin-right:3mm; }

/* ============== 打印 ============== */
@page { size:A4; margin:0; }
@media print {
  body { background:#fff; padding:0; }
  .page { box-shadow:none; width:210mm; min-height:297mm; }
}
</style>
</head>
<body>
<div class="page">

  <!-- ===== 顶部横幅 ===== -->
  <header class="banner">
    <h1></h1>
    <p class="slogan"></p>
  </header>

  <div class="content">

    <!-- ===== 基本信息 ===== -->
    <section class="section">
      <div class="section-tag"><span class="tri"></span><span class="body">基本信息</span></div>
      <div class="section-line"></div>
      <div class="basic">
        <img class="photo" src="assets/photo.jpeg" alt="证件照">
        <div class="b-line"><span class="k">姓　　名：</span></div>
        <div class="b-line">
          <span class="ic"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="#4D4D4D" stroke-width="2"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5" stroke="#4D4D4D" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span class="k">手机：</span></div>
        <div class="b-line"><span class="k">年　　龄：</span></div>
        <div class="b-line">
          <span class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="1.5" fill="none" stroke="#4D4D4D" stroke-width="2"/><polyline points="3,6 12,13 21,6" fill="none" stroke="#4D4D4D" stroke-width="2"/></svg></span>
          <span class="k">邮箱：</span></div>
        <div class="b-line"><span class="k">籍　　贯：</span></div>
        <div class="b-line">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M10 4C5.6 4 3 7 3 10c0 1.7 1 3.2 2.5 4.2L5 17l3.2-1.6c.6.1 1.2.2 1.8.2" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-linejoin="round"/><path d="M21 14c0-2.8-2.7-5-6-5s-6 2.2-6 5 2.7 5 6 5c.7 0 1.4-.1 2-.3L20 20l-.6-2.4c1-.9 1.6-2.2 1.6-3.6z" fill="#4D4D4D"/><circle cx="12.5" cy="14" r="1" fill="#fff"/><circle cx="16.5" cy="14" r="1" fill="#fff"/></svg></span>
          <span class="k">微信：</span></div>
        <div class="b-line"><span class="k">求职意向：</span></div>
        <div class="b-line">
          <span class="ic"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="8" ry="6.5" fill="none" stroke="#4D4D4D" stroke-width="2"/><path d="M16 7c1-2 3-2.5 4-2" fill="none" stroke="#4D4D4D" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14" r="2" fill="#4D4D4D"/></svg></span>
          <span class="k">微博：</span></div>
      </div>
    </section>

    <!-- ===== 个人评价 ===== -->
    <section class="section">
      <div class="section-tag"><span class="tri"></span><span class="body">个人评价</span></div>
      <div class="section-line"></div>
      <p class="paragraph"></p>
    </section>

    <!-- ===== 教育经历 ===== -->
    <section class="section">
      <div class="section-tag"><span class="tri"></span><span class="body">教育经历</span></div>
      <div class="section-line"></div>
      <div class="two-col">
        <div class="col-left">
          <div class="title"></div>
          <div class="date"></div>
        </div>
        <div class="col-right">
          <div class="org"></div>
          <p></p>
        </div>
      </div>
    </section>

    <!-- ===== 工作经历 ===== -->
    <section class="section">
      <div class="section-tag"><span class="tri"></span><span class="body">工作经历</span></div>
      <div class="section-line"></div>

      <div class="two-col">
        <div class="col-left">
          <div class="title"></div>
          <div class="date"></div>
        </div>
        <div class="col-right">
          <div class="org"></div>
          <p></p>
        </div>
      </div>

      <div class="two-col">
        <div class="col-left">
          <div class="title"></div>
          <div class="date"></div>
        </div>
        <div class="col-right">
          <div class="org"></div>
          <p></p>
        </div>
      </div>

      <div class="two-col">
        <div class="col-left">
          <div class="title"></div>
          <div class="date"></div>
        </div>
        <div class="col-right">
          <div class="org"></div>
        </div>
      </div>
    </section>

    <!-- ===== 专业技能 ===== -->
    <section class="section">
      <div class="section-tag"><span class="tri"></span><span class="body">专业技能</span></div>
      <div class="section-line"></div>
      <ul class="skill-list">
        <li></li>
        <li></li>
      </ul>
    </section>

  </div>
</div>
</body>
</html>
